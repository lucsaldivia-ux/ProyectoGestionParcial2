spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      mvc:
        routes:
          - id: clientes
            uri: http://localhost:8081
            predicates:
            - Path=/api/clientes/**

          - id: ventas
            uri: http://localhost:8082
            predicates:
            - Path=/api/ventas/**

          - id: pagos
            uri: http://localhost:8083
            predicates:
            - Path=/api/pagos/**

          - id: reportes
            uri: http://localhost:8084
            predicates:
            - Path=/api/reportes/**

          - id: notificaciones
            uri: http://localhost:8085
            predicates:
            - Path=/api/notificaciones/**
