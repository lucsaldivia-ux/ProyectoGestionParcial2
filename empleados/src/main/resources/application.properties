spring.application.name=empleados
spring.datasource.url=jdbc:mysql://localhost:3306/db_empleados?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
server.port=8080
# Habilitar Flyway
spring.flyway.enabled=true
# Ruta donde buscara los scripts SQL
spring.flyway.locations=classpath:db/migration
# Importante si ya tienes datos en la BD y no quieres empezar de cero
spring.flyway.baseline-on-migrate=true
